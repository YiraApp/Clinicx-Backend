# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Clinicx-api-dev

on:
  push:
    branches:
      - 22-04-2026-Dev
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '24.x'

      - name: npm install, build, and test
        # .env is not in git. config/database.ts and blob.service.ts refuse to load without their
        # settings, so the tests get placeholders (no test connects to a database or to storage).
        # FHIR dates carry the server's offset, +05:30 in production, so the tests run in India time.
        env:
          TZ: Asia/Kolkata
          DB_HOST: localhost
          DB_PORT: '1433'
          DB_USER: ci
          DB_PASSWORD: ci
          DB_NAME: ci
          AZURE_STORAGE_CONNECTION_STRING: UseDevelopmentStorage=true
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Prune dev dependencies
        run: npm prune --omit=dev

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            dist/
            node_modules/
            package.json
            package-lock.json

  deploy:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Clinicx-api-dev'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_89F1144125424F6785F217FEDBC9A378 }}
